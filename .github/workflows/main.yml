name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  rgbds_version: v1.0.3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The official Linux binaries are statically linked, so there is no
      # toolchain or libpng to install and nothing to compile.
      - name: Install rgbds
        run: |
          curl -fsSL --connect-timeout 15 --max-time 300 --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/rgbds.tar.xz" \
            "https://github.com/gbdev/rgbds/releases/download/${{ env.rgbds_version }}/rgbds-linux-x86_64.tar.xz"
          mkdir -p "$RUNNER_TEMP/rgbds"
          tar -xJf "$RUNNER_TEMP/rgbds.tar.xz" -C "$RUNNER_TEMP/rgbds"
          sudo install -m 755 -t /usr/local/bin \
            "$RUNNER_TEMP/rgbds/rgbasm" "$RUNNER_TEMP/rgbds/rgblink" \
            "$RUNNER_TEMP/rgbds/rgbfix" "$RUNNER_TEMP/rgbds/rgbgfx"
          for tool in rgbasm rgblink rgbfix rgbgfx; do "$tool" --version; done

      # No `make compare`: Crystal+ deliberately does not match roms.sha1.
      # The gate is that the default target (`all: crystal`) builds without
      # errors and leaves the tree clean. Note that -Weverything warnings do
      # not fail the build; rgbasm exits 0 on warnings unless -Werror is set.
      - name: Make
        run: |
          make -j$(nproc)
          .github/checkdiff.sh
